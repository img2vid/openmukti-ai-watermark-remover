name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      # Generates the Prisma client so TypeScript doesn't throw errors
      - name: Generate Prisma Client
        run: bunx prisma generate

      # Uses bunx to directly run Next.js build, bypassing your custom Z.AI script
      - name: Build Project
        run: bunx next build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Next.js will output to './out' ONLY if you set output: 'export' in next.config.ts
          path: './out'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
